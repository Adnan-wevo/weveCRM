name: wevetel-dev

services:

  # ── App (PHP 8.4-FPM + Node 24 + Supervisor) ──────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    container_name: wevetel_app_dev
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/var/www/html
    environment:
      # Docker-specific overrides — everything else is read from the mounted .env file
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # MinIO — override so app talks to minio container internally
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_BUCKET: ${MINIO_BUCKET}
      AWS_ENDPOINT: http://minio:9000
      AWS_URL: http://localhost:${MINIO_PORT}/${MINIO_BUCKET}
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      EXPORTS_DISK: minio
      # Reverb — bind on all interfaces inside container
      REVERB_HOST: "0.0.0.0"
      REVERB_PORT: "8080"
      REVERB_SERVER_PORT: "8080"
      # Keycloak — browser-facing URL comes from .env KEYCLOAK_BASE_URL
      # Internal URL used for server-side token exchange inside the container.
      # KEYCLOAK_REALM, KEYCLOAK_CLIENT_ID, and KEYCLOAK_CLIENT_SECRET are read
      # from the mounted .env file.
      KEYCLOAK_INTERNAL_BASE_URL: ${KEYCLOAK_INTERNAL_BASE_URL:-${KEYCLOAK_BASE_URL}}
      KEYCLOAK_REDIRECT_URI: http://wevetel.test:${APP_PORT}/auth/keycloak/callback
      # Mailpit — SMTP inside container
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      MAIL_SCHEME: "null"
      # Vite — browser WebSocket must go through nginx (APP_PORT), not direct Reverb port
      VITE_REVERB_HOST: wevetel.test
      VITE_REVERB_PORT: ${APP_PORT}
      VITE_REVERB_SCHEME: http
      # Entrypoint control
      DB_SEED: ${DB_SEED}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      keycloak-setup:
        condition: service_completed_successfully
    networks:
      - internal

  # ── Nginx ──────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: wevetel_nginx_dev
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - internal
      - public

  # ── Vite (Node 24 dev server) ─────────────────────────────────────────────
  vite:
    image: node:24-alpine
    container_name: wevetel_vite_dev
    working_dir: /var/www/html
    command: sh -c "npm install --no-progress && npm run dev"
    ports:
      - "${VITE_PORT}:5173"
    environment:
      # Override Reverb vars so Vite compiles WebSocket URL pointing to nginx (APP_PORT)
      VITE_REVERB_HOST: wevetel.test
      VITE_REVERB_PORT: ${APP_PORT}
      VITE_REVERB_SCHEME: http
    volumes:
      - .:/var/www/html
      - node_modules_dev:/var/www/html/node_modules
    networks:
      - internal
      - public

  # ── MariaDB ───────────────────────────────────────────────────────────────
  mariadb:
    image: mariadb:11.4
    container_name: wevetel_mariadb_dev
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mariadb_data_dev:/var/lib/mysql
      - ./docker/mariadb/01-grant-tenant-dbs.sql:/docker-entrypoint-initdb.d/01-grant-tenant-dbs.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: wevetel_redis_dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal

  # ── phpMyAdmin ────────────────────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: wevetel_phpmyadmin_dev
    restart: unless-stopped
    ports:
      - "${PMA_PORT}:80"
    environment:
      PMA_HOST: mariadb
      PMA_PORT: "3306"
      PMA_USER: ${DB_USERNAME}
      PMA_PASSWORD: ${DB_PASSWORD}
      UPLOAD_LIMIT: 50M
    depends_on:
      - mariadb
    networks:
      - internal
      - public

  # ── Mailpit (email testing) ─────────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: wevetel_mailpit_dev
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal
      - public

  # ── MinIO (S3-compatible) ─────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: wevetel_minio_dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data_dev:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal
      - public

  # ── MinIO bucket setup (runs once) ────────────────────────────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: wevetel_minio_setup_dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing local/${MINIO_BUCKET} &&
        mc anonymous set none local/${MINIO_BUCKET} &&
        echo '✅ MinIO bucket ready'
      "
    networks:
      - internal

  # ── Keycloak PostgreSQL ───────────────────────────────────────────────────
  keycloak-db:
    image: postgres:16-alpine
    container_name: wevetel_keycloak_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_DATABASE}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak_db_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USERNAME}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - internal

  # ── Keycloak ──────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: wevetel_keycloak_dev
    restart: unless-stopped
    command: start-dev
    ports:
      - "${KEYCLOAK_PORT}:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_DATABASE}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: ${KEYCLOAK_PORT}
      KC_HOSTNAME_STRICT: "true"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - internal
      - public

  # ── Keycloak Setup (provisions realm, client, test user) ──────────────────
  keycloak-setup:
    image: curlimages/curl:latest
    container_name: wevetel_keycloak_setup_dev
    user: "0:0"
    entrypoint: ["/bin/sh", "/setup/keycloak-setup.sh"]
    command:
      - "http://keycloak:8080"            # KC_URL    (internal)
      - "${KEYCLOAK_ADMIN_USER}"          # KC_ADMIN
      - "${KEYCLOAK_ADMIN_PASSWORD}"      # KC_PASS
      - "${KEYCLOAK_REALM}"               # KC_REALM
      - "${KEYCLOAK_CLIENT_ID}"           # KC_CLIENT
      - "http://wevetel.test:${APP_PORT}" # APP_URL   (browser-facing)
      - "http://nginx:80"                 # APP_INTERNAL_URL (backchannel from KC→nginx)
    environment:
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID}
    volumes:
      - ./docker/keycloak-setup.sh:/setup/keycloak-setup.sh:ro
      - ./.env:/var/www/html/.env
    depends_on:
      keycloak:
        condition: service_healthy
    restart: "no"
    networks:
      - internal

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  mariadb_data_dev:
  redis_data_dev:

  minio_data_dev:
  keycloak_db_data_dev:
  node_modules_dev:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  internal:
    driver: bridge
  public:
    driver: bridge
